<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagihan Sengkuni Net</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a1a1a; margin-bottom: 25px; border-bottom: 2px solid #25D366; padding-bottom: 10px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background-color: #e0e0e0; color: #555; transition: 0.3s; }
    .tab-btn.active { background-color: #25D366; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; color: #444; }
    select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; outline: none; box-sizing: border-box; }
    
    .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
    .card { background: #f8f9fa; border-left: 4px solid #007bff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card.lunas { border-left-color: #25D366; }
    .card.belum { border-left-color: #dc3545; }
    .card h4 { margin: 0; color: #666; font-size: 14px; }
    .card p { margin: 5px 0 0 0; font-size: 20px; font-weight: bold; color: #333; }

    .item, .item-sheet { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .info { display: flex; flex-direction: column; flex: 1; }
    .nama, .nama-sheet { font-weight: bold; font-size: 16px; color: #333; }
    .detail, .detail-sheet { font-size: 13px; color: #777; margin-top: 4px; }
    .actions, .actions-sheet { display: flex; gap: 5px; }
    
    .btn-wa { background-color: #25D366; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-lunas, .btn-lunas-sheet { background-color: #007bff; color: white; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-reset { background-color: #dc3545; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 20px; }
    
    .btn-wa:hover { background-color: #128C7E; }
    .btn-lunas:hover, .btn-lunas-sheet:hover { background-color: #0056b3; }
    button:disabled { background-color: #ccc !important; cursor: not-allowed; }
    #loading { text-align: center; color: #666; font-style: italic; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Tagihan Sengkuni Net</h2>
    
    <div class="tabs">
      <button id="btn-tab-monitor" class="tab-btn active" onclick="bukaTab('monitor')">🖥️ Monitor Tagihan</button>
      <button id="btn-tab-pelanggan" class="tab-btn" onclick="bukaTab('pelanggan')">📝 Data Sengkuni Net</button>
    </div>

    <div class="form-group">
      <label>Pilih Bulan Tagihan:</label>
      <select id="bulanSelect">
        <option value="Januari">Januari</option><option value="Februari">Februari</option>
        <option value="Maret">Maret</option><option value="April" selected>April</option>
        <option value="Mei">Mei</option><option value="Juni">Juni</option>
        <option value="Juli">Juli</option><option value="Agustus">Agustus</option>
        <option value="September">September</option><option value="Oktober">Oktober</option>
        <option value="November">November</option><option value="Desember">Desember</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tanggal Jatuh Tempo:</label>
      <input type="number" id="tglTempo" value="4">
    </div>

    <!-- TAB MONITOR -->
    <div id="tab-monitor" class="tab-content active">
      <div class="dashboard-grid">
        <div class="card lunas">
          <h4>PEMASUKAN (LUNAS)</h4>
          <p id="dashPemasukan">Rp 0</p>
        </div>
        <div class="card belum">
          <h4>KLIEN BELUM BAYAR</h4>
          <p id="dashBelumBayar">0 Orang</p>
        </div>
        <div class="card belum">
          <h4>NOMINAL BELUM BAYAR</h4>
          <p id="dashNominalBelum">Rp 0</p>
        </div>
      </div>
      <div id="loading">Memuat data dari Google Sheets...</div>
      <div id="listMonitor"></div>
      <button class="btn-reset" onclick="resetBulanBaru()">🔄 Reset Semua ke Belum Bayar</button>
    </div>

    <!-- TAB DATA PELANGGAN -->
    <div id="tab-pelanggan" class="tab-content">
      <div id="listPelanggan"></div>
    </div>

  </div>

  <script>
    const TOKEN_FONNTE = "dUxQzRfCNEZRW7vjVx3G";
    const URL_SHEETS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSV673nBl_6Wn_6eBjiJzoSQfHDn0VQRCNTGsjrdo2fLPFZenxVD1MBvatyIJ8mTGuZX58w5UI3uII9/pub?output=csv";
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzBhbUYfrhjZ4qS8HgPrPNSiPBh06oeh1wrVQhjOp3ssoBaAN9CC9zoSJK-zIPRcjs/exec"; 

    const hpFirman = "6282115794996"; 
    const hpRendi = "62813299366"; 

    function bukaTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      if(tabName === 'monitor') document.getElementById('btn-tab-monitor').classList.add('active');
      if(tabName === 'pelanggan') document.getElementById('btn-tab-pelanggan').classList.add('active');
    }

    function muatData() {
      Papa.parse(URL_SHEETS_CSV, {
        download: true,
        complete: function(results) {
          document.getElementById('loading').style.display = 'none';
          tampilkanDashboardDanPelanggan(results.data.slice(1));
        }
      });
    }

    function tampilkanDashboardDanPelanggan(data) {
      let totalPemasukan = 0;
      let totalBelumBayar = 0;
      let nominalBelumBayar = 0;

      const listMonitor = document.getElementById('listMonitor');
      const listPelanggan = document.getElementById('listPelanggan');
      
      listMonitor.innerHTML = "";
      listPelanggan.innerHTML = "";

      data.forEach(row => {
        if (!row[0]) return;
        const nama = row[0].trim();
        const noWa = row[1] ? row[1].toString().trim() : "";
        const idPel = row[2] ? row[2].trim() : "-";
        const hargaStr = row[3] ? row[3].toString().replace(/[^0-9]/g, '') : "0";
        const petugas = row[4] ? row[4].toLowerCase().trim() : "";
        const status = row[5] ? row[5].toUpperCase().trim() : "BELUM BAYAR";
        
        let nominalAngka = parseInt(hargaStr) || 0;

        if (status === 'LUNAS') {
          totalPemasukan += nominalAngka;
        } else {
          totalBelumBayar++;
          nominalBelumBayar += nominalAngka;
        }

        let tombolAksi = status !== 'LUNAS' ? `<button class="btn-lunas" onclick="setLunas('${nama}', '${idPel}', '${hargaStr}', '${petugas}', this)">Set Lunas</button>` : `<span style="color:green; font-weight:bold;">LUNAS ✅</span>`;
        
        const divMon = document.createElement('div');
        divMon.className = 'item';
        divMon.innerHTML = `
          <div class="info">
            <span class="nama">${nama}</span>
            <span class="detail">Tagihan: Rp ${nominalAngka.toLocaleString('id-ID')} | <b>${status}</b></span>
          </div>
          <div class="actions">${tombolAksi}</div>
        `;
        listMonitor.appendChild(divMon);

        const divPel = document.createElement('div');
        divPel.className = 'item-sheet';
        divPel.innerHTML = `
          <div class="info">
            <span class="nama-sheet">${nama}</span>
            <span class="detail-sheet">ID: ${idPel} | <b>Rp ${nominalAngka.toLocaleString('id-ID')}</b></span>
          </div>
          <div class="actions-sheet">
            <button class="btn-wa" onclick="kirimFonnte('${nama}', '${noWa}', '${idPel}', '${hargaStr}', this)">WA</button>
          </div>
        `;
        listPelanggan.appendChild(divPel);
      });

      document.getElementById('dashPemasukan').innerText = `Rp ${totalPemasukan.toLocaleString('id-ID')}`;
      document.getElementById('dashBelumBayar').innerText = `${totalBelumBayar} Orang`;
      document.getElementById('dashNominalBelum').innerText = `Rp ${nominalBelumBayar.toLocaleString('id-ID')}`;
    }

    async function setLunas(nama, id, harga, petugas, btn) {
      if(!confirm("Set Lunas untuk " + nama + "?")) return;
      btn.innerText = "...";
      btn.disabled = true;

      let tujuanWA = petugas === "firman" ? hpFirman : (petugas === "rendi" ? hpRendi : hpFirman + "," + hpRendi);

      try {
        await fetch(URL_APPS_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams({ 'nama': nama, 'aksi': 'lunas' })
        });

        await fetch('https://api.fonnte.com/send', {
          method: 'POST',
          headers: { 'Authorization': TOKEN_FONNTE },
          body: new URLSearchParams({
            'target': tujuanWA,
            'message': `✅ *LAPORAN LUNAS*\nNama: ${nama}\nID: ${id}\nNominal: Rp ${harga}\nPetugas: ${petugas.toUpperCase()}`
          })
        });

        alert("Berhasil diset Lunas!");
        setTimeout(muatData, 2000);
      } catch (e) {
        alert("Gagal memproses lunas");
        btn.disabled = false;
        btn.innerText = "Set Lunas";
      }
    }

    async function resetBulanBaru() {
      const konfirmasi = prompt("Ketik 'RESET' untuk mengembalikan semua status tagihan menjadi Belum Bayar:");
      if (konfirmasi !== "RESET") return;

      try {
        await fetch(URL_APPS_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          body: new URLSearchParams({ 'aksi': 'reset' })
        });
        alert("Semua status berhasil di-reset!");
        setTimeout(muatData, 2000);
      } catch (e) {
        alert("Gagal mereset data.");
      }
    }

    function kirimFonnte(nama, noWa, idPel, harga, btn) {
      let hp = noWa.replace(/[^0-9]/g, ''); if (hp.startsWith('0')) hp = '62' + hp.substring(1);
      const bulan = document.getElementById('bulanSelect').value;
      const tgl = document.getElementById('tglTempo').value;
      const pesan = `Pelanggan SENGKUNI NET\nYth. *${nama}*\nTagihan internet *${bulan}.${new Date().getFullYear()}*\nID: *${idPel}*\nTotal: *Rp ${harga}*\nTempo: tgl *${tgl}*\nAdmin: RENDI & FIRMAN`;

      btn.innerText = "...";
      fetch('https://api.fonnte.com/send', { 
        method: 'POST', 
        headers: { 'Authorization': TOKEN_FONNTE }, 
        body: new URLSearchParams({ 'target': hp, 'message': pesan }) 
      }).then(() => { btn.innerText = "OK ✅"; }).catch(() => { btn.innerText = "Error"; });
    }

    muatData();
    setInterval(muatData, 15000);
  </script>
</body>
</html>
